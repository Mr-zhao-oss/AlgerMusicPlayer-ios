name: Build iOS IPA

# Builds an UNSIGNED .ipa for AlgerMusicPlayer by wrapping the official
# Android web assets (already bundled with the cloud music API at
# mc.alger.fun) in a Capacitor iOS app, then archiving it on a GitHub
# macOS runner with code signing disabled. Download the artifact and
# sideload it with Sideloadly/AltStore using a free Apple ID.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show Xcode version
        run: xcodebuild -version && xcrun simctl list >/dev/null && echo "xcode ok"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Add iOS platform
        run: npx cap add ios

      - name: Patch Info.plist (HTTP ATS + background audio + rotation)
        run: bash scripts/patch-ios.sh ios/App/App/Info.plist

      - name: Sync web assets & plugins to iOS
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Archive (unsigned, no signing required)
        run: |
          set -e
          mkdir -p build
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            -destination generic/platform=iOS \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_ENTITLEMENTS="" \
            | tee build/xcodebuild-archive.log | tail -40

      - name: Show what was built
        run: |
          ls -la build/App.xcarchive/Products/Applications/ || true
          ls -la build/App.xcarchive/Products/Applications/App.app || true

      - name: Package unsigned IPA
        run: |
          set -e
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -rq "AlgerMusicPlayer-ios.ipa" Payload
          ls -la "AlgerMusicPlayer-ios.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlgerMusicPlayer-ios-ipa
          path: build/AlgerMusicPlayer-ios.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-failure-log
          path: build/xcodebuild-archive.log
          if-no-files-found: ignore
